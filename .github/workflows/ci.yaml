# =============================================================================
# CI/CD Pipeline - Build & Push Images, Update Infrastructure Repo
# =============================================================================
# This workflow:
# 1. Builds Docker images for backend and frontend
# 2. Pushes them to GitHub Container Registry (GHCR)
# 3. Updates image tags in the infrastructure repository
# 4. ArgoCD then automatically deploys the new version
# =============================================================================

name: CI - Build and Update Infra

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci.yaml'
  workflow_dispatch:  # Allow manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  BACKEND_IMAGE: maria-guestbook-backend
  FRONTEND_IMAGE: maria-guestbook-frontend
  INFRA_REPO: ${{ github.repository_owner }}/maria-guestbook-infra

jobs:
  # ===========================================================================
  # Job 1: Build and Push Docker Images
  # ===========================================================================
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----- Backend Image -----
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.BACKEND_IMAGE }}:${{ steps.vars.outputs.short_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----- Frontend Image -----
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.FRONTEND_IMAGE }}:${{ steps.vars.outputs.short_sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### 🐳 Images Built & Pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Tag |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | \`${{ steps.vars.outputs.short_sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | \`${{ steps.vars.outputs.short_sha }}\` |" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Job 2: Update Infrastructure Repository (GitOps)
  # ===========================================================================
  update-infra:
    name: Update Infra Repo
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout infrastructure repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ secrets.INFRA_PAT }}
          path: infra

      - name: Update image tags in values.yaml
        run: |
          cd infra

          # Update backend image tag
          sed -i 's|tag: ".*"  # backend-tag|tag: "${{ needs.build.outputs.short_sha }}"  # backend-tag|' helm/guestbook/values.yaml

          # Update frontend image tag
          sed -i 's|tag: ".*"  # frontend-tag|tag: "${{ needs.build.outputs.short_sha }}"  # frontend-tag|' helm/guestbook/values.yaml

          echo "Updated values.yaml:"
          cat helm/guestbook/values.yaml | grep -A2 "image:"

      - name: Commit and push changes
        run: |
          cd infra
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          git add helm/guestbook/values.yaml

          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🚀 Update images to ${{ needs.build.outputs.short_sha }}

          Triggered by: ${{ github.repository }}@${{ github.sha }}
          Workflow: ${{ github.workflow }}
          Author: ${{ github.actor }}"

            git push
            echo "### ✅ Infrastructure Updated" >> $GITHUB_STEP_SUMMARY
            echo "New image tag: \`${{ needs.build.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY
          fi
